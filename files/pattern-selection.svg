<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="400" fill="#202026"/>
    
    <!-- Grid of 4 Cards -->
    <g transform="translate(20, 20)">
        
        <!-- Card 1: Horizontal Line -->
        <rect x="0" y="0" width="170" height="170" rx="12" fill="#2A2A30" stroke="#444" stroke-width="1"/>
        <text x="85" y="35" font-family="Arial" font-size="14" fill="#888" text-anchor="middle" font-weight="bold">HORIZONTAL</text>
        <g transform="translate(50, 75)">
            <rect x="0" y="0" width="20" height="20" rx="4" fill="#db4040d6"/>
            <rect x="25" y="0" width="20" height="20" rx="4" fill="#db4040d6"/>
            <rect x="50" y="0" width="20" height="20" rx="4" fill="#db4040d6"/>
        </g>

        <!-- Card 2: Vertical Line -->
        <rect x="190" y="0" width="170" height="170" rx="12" fill="#2A2A30" stroke="#444" stroke-width="1"/>
        <text x="275" y="35" font-family="Arial" font-size="14" fill="#888" text-anchor="middle" font-weight="bold">VERTICAL</text>
        <g transform="translate(265, 50)">
            <rect x="0" y="0" width="20" height="20" rx="4" fill="#3a9961"/>
            <rect x="0" y="25" width="20" height="20" rx="4" fill="#3a9961"/>
            <rect x="0" y="50" width="20" height="20" rx="4" fill="#3a9961"/>
        </g>

        <!-- Card 3: Rectangle (Square) -->
        <rect x="0" y="190" width="170" height="170" rx="12" fill="#2A2A30" stroke="#444" stroke-width="1"/>
        <text x="85" y="225" font-family="Arial" font-size="14" fill="#888" text-anchor="middle" font-weight="bold">RECTANGLE</text>
        <g transform="translate(50, 250)">
            <!-- 3x3 Grid -->
            <rect x="0" y="0" width="20" height="20" rx="4" fill="#4299E1"/>
            <rect x="25" y="0" width="20" height="20" rx="4" fill="#4299E1"/>
            <rect x="50" y="0" width="20" height="20" rx="4" fill="#4299E1"/>
            
            <rect x="0" y="25" width="20" height="20" rx="4" fill="#4299E1"/>
            <rect x="25" y="25" width="20" height="20" rx="4" fill="#4299E1"/>
            <rect x="50" y="25" width="20" height="20" rx="4" fill="#4299E1"/>

            <rect x="0" y="50" width="20" height="20" rx="4" fill="#4299E1"/>
            <rect x="25" y="50" width="20" height="20" rx="4" fill="#4299E1"/>
            <rect x="50" y="50" width="20" height="20" rx="4" fill="#4299E1"/>
        </g>

        <!-- Card 4: Cross -->
        <rect x="190" y="190" width="170" height="170" rx="12" fill="#2A2A30" stroke="#444" stroke-width="1"/>
        <text x="275" y="225" font-family="Arial" font-size="14" fill="#888" text-anchor="middle" font-weight="bold">CROSS</text>
        <g transform="translate(240, 250)">
            <!-- Top arm -->
            <rect x="25" y="0" width="20" height="20" rx="4" fill="#F6E05E"/>
            <!-- Horizontal arm -->
            <rect x="0" y="25" width="20" height="20" rx="4" fill="#F6E05E"/>
            <rect x="25" y="25" width="20" height="20" rx="4" fill="#F6E05E"/>
            <rect x="50" y="25" width="20" height="20" rx="4" fill="#F6E05E"/>
            <!-- Bottom arm -->
            <rect x="25" y="50" width="20" height="20" rx="4" fill="#F6E05E"/>
        </g>
    </g>
</svg>
