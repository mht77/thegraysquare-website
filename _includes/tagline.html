{%- assign words = include.words | default: site.data.defaults.home.hero.tagline -%}
{%- assign tones = "t-orange,t-red,t-blue" | split: "," -%}
<p class="tagline">{% for word in words %}{% assign i = forloop.index0 | modulo: 3 %}<span class="{{ tones[i] }}">{{ word }}</span>{% unless forloop.last %}{{ " " }}{% endunless %}{% endfor %}</p>
