meta:
  title: "The Gray Square: Swipe. Swap. Solve."
  description: A minimalist puzzle about carrying colors across a 7×7 board. One rule, 343 solver-checked boards, a real par on every one. No ads, no timers, no lives.
  share_description: "One rule: landing trades your color for the tile's. 343 boards, seven shapes, no ads."

hero:
  title_start: The
  title_gray: Gray
  title_end: Square
  tagline: [Swipe., Swap., Solve.]
  lede: A minimalist puzzle about carrying colors across a 7×7 board. Wherever the gray square lands, it trades the color it is carrying for the color already there.
  chips:
    - label: 343 BOARDS
      color: yellow
    - label: 7 SHAPES
      color: purple
    - label: NO ADS
      color: green
  phone_back:
    image: /img/levels.jpg
    alt: "The level list: seven sets of seven, gold tiles for levels cleared at par."
  phone_front:
    image: /img/board-goal-cues.jpg
    alt: "A level in progress: a 7×7 board of colored tiles, the goal row outlined, two cells already ticked green, and the gray square waiting below the board."

how:
  eyebrow: How it plays
  title: Think three moves
  title_accent: ahead.
  lede: "Every move fixes one cell and disturbs another. Try it: a real 7×7 board with a three-cell goal and a par of 9."
  demo:
    label: Playable demo board. Use the arrow keys to move the gray square.
    goal: Goal
    moves: Moves
    reset: Restart the demo
    hint_touch: Swipe on the board, or tap a neighboring cell.
    hint_mouse: Arrow keys, or click a neighboring cell.
    goal_count: "{done} of {total}"
    left_for_par: "{n} left for par"
    on_par: on par
    over_par: "{n} over par"
    win_par: "Solved in {moves}. That's par. Gold tile."
    win_over: "Solved in {moves}. Par is {par}. Try again?"
  rules:
    - title: Swipe to move
      text: The square starts just below the board, carrying nothing, and slides one cell per swipe.
    - title: Landing swaps colors
      text: You drop the color you carry and pick up the one under you. The very first move is free. With nothing in hand, you simply pick a color up.
    - title: Fill the goal cells
      text: "Only a handful of cells are marked. The rest of the board is your workshop: a place to park a color you will need in four moves' time."

par:
  eyebrow: Par, keys and gold
  title: Beat the par.
  title_accent: Earn the gold.
  lede: Every board has a solver-checked best score. A solution is really a delivery route, and par is the length of the shortest one.
  par_card:
    title: Par and the move budget
    body: |
      **Par** is the fewest moves the level can possibly be solved in, from 4 to 25 depending on the board. Past the **move budget**, a clear no longer counts for anything.

      The move meter under the board tracks you live. A sloppy replay can never cost you a record: the save keeps your best run, not your last.
  key_card:
    title: Clear the board. Earn a key.
    body: |
      Clear a level and you get a key. Clear it *in par* and you get two, plus a gold tile on the level list. Keys open levels, and that is all they do.

      A key opens any locked board whose left or upper neighbor is already open, so a board you cannot crack never blocks the rest. You start with three; key packs are the game's only purchase.

boards:
  eyebrow: The boards
  title: 343 boards.
  title_accent: Seven shapes.
  lede: 49 boards per shape, presented as seven sets of seven. A bigger shape is not simply a harder one. A three-cell line with its colors scattered to opposite corners can outlast a thirteen-cell cross whose pieces happen to be nearby.
  patterns:
    - name: Horizontal
      count: 49 boards
      cells: "000111000"
    - name: Vertical
      count: 49 boards
      cells: "010010010"
    - name: Cross
      count: 49 boards
      cells: "010111010"
    - name: Diagonal
      count: 49 boards
      cells: "100010001"
    - name: L
      count: 49 boards
      cells: "100100111"
    - name: Square
      count: 49 boards
      cells: "111101111"
    - name: Triangle
      count: 49 boards
      cells: "010101111"

accessibility:
  eyebrow: Accessibility
  title: Made for
  title_accent: every eye.
  lede: Seven playable colors on one board is a real accessibility problem, and the palette is hue-only. Colorblind symbols and goal outlines are built in. Both toggle mid-level and take effect immediately.
  switch: Colorblind symbols
  points:
    - "**Colorblind symbols:** every color also carries a distinct shape, on tiles, on your square and in the goal map, so pairs that collapse under red-green CVD stay tellable apart."
    - "**Outline goal cells:** rings the cells still to fill and badges the ones already right. Left off, the board stays silent about the goal beyond dimming the cells that are not part of it."

features:
  - eyebrow: Cloud save
    title: Your progress travels
    body: |
      Progress is saved locally first, so an offline phone never loses a thing. On iPhone and iPad it also restores through iCloud; on Android, sign in to Google Play Games and it syncs there.

      When a device and the cloud disagree the two are **merged rather than overwritten**: unlocked levels combine, the better move count is kept, and a spend on one device cannot come back as extra keys on another.
  - eyebrow: Machine-verified
    title: Where the numbers come from
    body: |
      A customized **A\* search** solves each candidate board and returns its optimal move count, which becomes par. The heuristic estimates a lower bound from transport cost: how far each wrong cell's correct color has to travel to reach it.

      Boards that cannot be solved, or that solve too cheaply or too expensively, are discarded. Every level in the game is known to be solvable in the count printed on it.

